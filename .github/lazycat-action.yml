version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: chibisafe-server
build:
  toolchains: []
  run_buildscript: false
images:
  - id: chibisafe-server
    target: service
    service: chibisafe-server
    source: chibisafe/chibisafe-server
    channel: stable
    sort: semver
    tag_regex: ^v?6[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
  - id: chibisafe-web
    target: service
    service: chibisafe-web
    source: chibisafe/chibisafe
    channel: stable
    sort: semver
    tag_regex: ^v?6[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Chibisafe
    skip_if_version_exists: true
